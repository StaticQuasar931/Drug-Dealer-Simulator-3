<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00b4ff"/>
      <stop offset="100%" stop-color="#b444ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grid lines -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff88" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="80"  cy="150" r="120" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.08"/>
  <circle cx="80"  cy="150" r="80"  fill="none" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <circle cx="1120" cy="150" r="140" fill="none" stroke="#00b4ff" stroke-width="1" opacity="0.08"/>
  <circle cx="1120" cy="150" r="90"  fill="none" stroke="#00b4ff" stroke-width="1" opacity="0.12"/>

  <!-- Dollar signs scattered -->
  <text x="60"  y="80"  font-size="28" fill="#00ff88" opacity="0.12" font-family="Arial" font-weight="900">$</text>
  <text x="1100" y="220" font-size="36" fill="#00b4ff" opacity="0.12" font-family="Arial" font-weight="900">$</text>
  <text x="600"  y="40"  font-size="20" fill="#b444ff" opacity="0.10" font-family="Arial" font-weight="900">$</text>

  <!-- Main title -->
  <text x="600" y="140" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="72" font-weight="900"
        fill="url(#title)" filter="url(#glow)"
        letter-spacing="3">
    DRUG DEALER
  </text>
  <text x="600" y="200" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="72" font-weight="900"
        fill="url(#title)" filter="url(#glow)"
        letter-spacing="8">
    SIMULATOR
  </text>

  <!-- Version badge -->
  <rect x="525" y="218" width="150" height="28" rx="14" fill="rgba(0,255,136,0.12)" stroke="#00ff88" stroke-width="1"/>
  <text x="600" y="236" text-anchor="middle" font-family="Arial" font-size="13" fill="#00ff88" letter-spacing="3">VERSION 3.0</text>

  <!-- Subtitle -->
  <text x="600" y="278" text-anchor="middle" font-family="Arial" font-size="16" fill="#606080" letter-spacing="2">
    IDLE TYCOON EMPIRE BUILDER
  </text>

  <!-- Border glow -->
  <rect x="1" y="1" width="1198" height="298" rx="0" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.2"/>
</svg>
