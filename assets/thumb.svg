<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00ff88" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="24" fill="url(#bg)"/>
  <rect width="512" height="512" rx="24" fill="url(#grid)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00b4ff" stroke-width="1" opacity="0.10"/>

  <!-- Center circle (deal button representation) -->
  <circle cx="256" cy="220" r="120" fill="rgba(0,255,136,0.07)" stroke="#00ff88" stroke-width="2.5" filter="url(#glow)"/>

  <!-- $ symbol -->
  <text x="256" y="260" text-anchor="middle" font-size="110" font-family="'Arial Black', Arial" font-weight="900"
        fill="url(#title)" filter="url(#glow)">$</text>

  <!-- Title -->
  <text x="256" y="385" text-anchor="middle" font-size="30" font-family="'Arial Black', Arial" font-weight="900"
        fill="#00ff88" letter-spacing="2">DDS3</text>
  <text x="256" y="415" text-anchor="middle" font-size="14" font-family="Arial"
        fill="#606080" letter-spacing="3">IDLE TYCOON</text>

  <!-- Border -->
  <rect x="2" y="2" width="508" height="508" rx="22" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.25"/>
</svg>
